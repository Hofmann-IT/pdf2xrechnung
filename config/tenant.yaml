# =====================================================================================
# Mandanten (config/tenant.yaml)
#
# Jeder Mandant besitzt eine stabile technische ID. Die Kombination aus
#   tenant_id + SHA-256 der Quell-PDF
# ist im System eindeutig (Idempotenz).
#
# fixed-values: Unternehmensangaben, die auf der PDF nur grafisch (Briefpapier) vorhanden sind
# und daher nicht extrahiert werden können. Sie werden über Mapping-Regeln vom Typ "fixed"
# (profiles/*.yaml, rule.key) auf Business Terms abgebildet. Schlüssel in Kleinbuchstaben mit
# Bindestrich (kebab-case), damit sie unverändert gebunden werden.
#
# KEINE SECRETS in dieser Datei.
# =====================================================================================
tenants:
  - id: hofmann-it
    name: "Hofmann IT"
    enabled: true
    # Unterverzeichnis unterhalb von app.directories.inbox; "" = Wurzel von inbox/.
    # Bei mehreren Mandanten muss jeder aktive Mandant ein eigenes Unterverzeichnis verwenden.
    inbox-subdirectory: ""
    # Profile in Prüfreihenfolge; das erste Profil, dessen Klassifizierung trifft, wird verwendet.
    profiles:
      - standard
    fixed-values:
      # --- Verkäufer (BG-4) ---
      seller-name: "Hofmann IT"                       # BT-27
      seller-street: "Musterstraße 1"                 # BT-35
      seller-post-code: "12345"                       # BT-38
      seller-city: "Musterstadt"                      # BT-37
      seller-country-code: "DE"                       # BT-40
      seller-vat-id: "DE123456789"                    # BT-31
      seller-tax-number: "12/345/67890"               # BT-32
      seller-email: "rechnung@example.invalid"        # BT-43 / BT-34
      seller-contact-name: "Uwe Hofmann"              # BT-41
      seller-phone: "+49 000 0000000"                 # BT-42
      # --- Zahlungsinformationen (BG-16/BG-17) ---
      payment-means-type-code: "58"                   # BT-81, UNTDID 4461: 58 = SEPA credit transfer
      payment-account-iban: "DE02120300000000202051"  # BT-84 (Beispiel-IBAN mit gültiger Prüfziffer; XRechnung prüft BR-DE-19)
      payment-account-name: "Hofmann IT"              # BT-85
      payment-bic: "BYLADEM1001"                      # BT-86
      # --- Sonstiges ---
      invoice-currency: "EUR"                         # BT-5

    # ---------------------------------------------------------------------------------
    # Export des Rechnungsausgangsbuchs (Oberfläche: Ausgangsrechnungen → Export)
    #
    # Die einfache CSV ist immer verfügbar. Der DATEV-Buchungsstapel (DATEV-Format EXTF,
    # Version 700, Formatversion 13) wird nur angeboten, wenn export.datev.enabled: true.
    # ALLE Werte darunter kommen vom Steuerberater bzw. aus dem DATEV-Mandat. Die hier
    # eingetragenen Konten sind PLATZHALTER und müssen vor dem ersten Export ersetzt werden.
    # Feldregeln: docs/datev-format-referenz.md
    # ---------------------------------------------------------------------------------
    export:
      datev:
        enabled: false
        consultant-number: "1001"      # Beraternummer, 4–7 Ziffern (Kopfzeile #11) – PLATZHALTER
        client-number: "1"             # Mandantennummer, 1–5 Ziffern (Kopfzeile #12) – PLATZHALTER
        fiscal-year-start: "01-01"     # Wirtschaftsjahresbeginn MM-DD
        account-length: 4              # Sachkontenlänge (4–8), muss dem DATEV-Mandat entsprechen
        chart-of-accounts: "03"        # Sachkontenrahmen: "03" = SKR03, "04" = SKR04
        debtor-strategy: COLLECTIVE    # COLLECTIVE = Sammeldebitor, PER_CUSTOMER = Konto je Kunde
        collective-debtor-account: "10000"   # Sammel-Debitorenkonto bei COLLECTIVE – PLATZHALTER
        customer-accounts:             # nur bei PER_CUSTOMER: Kundenname (BT-44, exakt) → Debitorenkonto
          "Beispiel GmbH": "10001"
        revenue-accounts:              # Erlöskonto je Geschäftsfall und Steuersatz – PLATZHALTER
          "DOMESTIC_STANDARD:19": { account: "8400" }   # SKR03-Beispiel: Erlöse 19 % USt (Automatikkonto)
          "DOMESTIC_STANDARD:7":  { account: "8300" }   # SKR03-Beispiel: Erlöse 7 % USt (Automatikkonto)
          "NO_VAT":               { account: "8195" }   # SKR03-Beispiel: Erlöse als Kleinunternehmer § 19 UStG
          "EU_REVERSE_CHARGE":    { account: "8336" }   # SKR03-Beispiel: Leistungen im EU-Ausland (§ 13b), BU-Schlüssel je Steuerberater
          "THIRD_COUNTRY":        { account: "8120" }   # SKR03-Beispiel: Steuerfreie Ausfuhrlieferungen
        origin: "RE"                   # Herkunft (Kopfzeile #8)
        exported-by: "PDF-zu-ERechnung"   # Exportiert von (Kopfzeile #9, max. 25 Wortzeichen)
        dictation-shortcut: ""         # Diktatkürzel, 2 oder 4 Großbuchstaben, optional
        lock-records: true             # Festschreibung (Kopfzeile #21, Feld #114)
        booking-text-template: "Rechnung {invoiceNumber} {customerName}"   # Feld #14, max. 60 Zeichen
